name: Build and Release

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build and test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: lime
            test_name: test_lime
            asset_name: lime-linux-amd64
          - os: windows-latest
            artifact_name: lime.exe
            test_name: test_lime.exe
            asset_name: lime-windows-amd64.exe
          - os: macos-latest
            artifact_name: lime
            test_name: test_lime
            asset_name: lime-darwin-amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build CLI and tests (Linux / macOS)
        if: runner.os != 'Windows'
        run: bash build.sh

      - name: Build CLI and tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash build.sh

      - name: Run test suite
        shell: bash
        run: ./${{ matrix.test_name }}

      - name: Upload release binary
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./${{ matrix.artifact_name }}
          asset_name: ${{ matrix.asset_name }}
          asset_content_type: application/octet-stream
